services:
  - type: web
    name: orbitalwatch-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.10"
      - key: CORS_ORIGINS
        value: ["*"]
      - key: WEB_CONCURRENCY
        value: "1"
      - key: ENVIRONMENT
        value: "production"
      - key: RELOAD
        value: "false"
