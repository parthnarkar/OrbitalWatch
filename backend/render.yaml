services:
  - type: web
    name: orbitalwatch-api
    env: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
      - key: CORS_ORIGINS
        value: '["https://orbital-watch-bay.vercel.app","https://orbitalwatch-backend.onrender.com"]'
      - key: WEB_CONCURRENCY
        value: "1"
